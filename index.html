<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또 번호 5세트 추천기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-btn">🌙 다크 모드로 전환</button>
    </div>
    <div class="container">
        <h1>🎰 로또 번호 추천기</h1>
        <p>버튼을 누르면 로또 번호 5세트를 추천합니다.</p>

        <button id="generate-btn">
            번호 추천받기
        </button>

        <div id="result"></div>

        <div class="info">
            각 세트는 1~45 사이의 중복 없는 번호 6개로 생성됩니다.
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
