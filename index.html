<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또 번호 5세트 추천기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-btn">🌙 다크 모드로 전환</button>
    </div>
    <div class="container">
        <h1>🎰 로또 번호 추천기</h1>
        <p>버튼을 누르면 로또 번호 5세트를 추천합니다.</p>

        <button id="generate-btn">
            번호 추천받기
        </button>

        <div id="result"></div>

        <div class="info">
            각 세트는 1~45 사이의 중복 없는 번호 6개로 생성됩니다.
        </div>

        <hr class="divider">

        <div class="contact-section">
            <h2>🤝 제휴 문의</h2>
            <p>로또 번호 추천 서비스와 함께할 파트너를 찾습니다.</p>
            <form action="https://formspree.io/f/xqejljgo" method="POST" id="contact-form">
                <div class="form-group">
                    <label for="name">성함/업체명</label>
                    <input type="text" id="name" name="name" required placeholder="예: 홍길동">
                </div>
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" rows="4" required placeholder="문의하실 내용을 입력해주세요."></textarea>
                </div>
                <button type="submit" class="submit-btn">문의하기</button>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
